# Two colleagues on a real benchmark task imported from a registry, not a hand-written stand-in (ADR-0037).
# The task is a real Terminal-Bench 2.0 task; Harbor materializes it, Mesocosm imports the directory.
#
# Prepare the task once (Harbor fetches and builds it), then point Mesocosm at where it landed:
#   harbor run -p terminal-bench@2.0/fix-git -e docker        # materializes the task directory + image
#   export MESOCOSM_TASKS_ROOT=$HOME/.cache/harbor/tasks       # the directory that holds terminal-bench@2.0/fix-git/
#   uv run mesocosm env compose examples/world-benchmark.yaml --out /tmp/compose.yml --run-label benchmark
#   docker compose -f /tmp/compose.yml up -d --build
#   uv run mesocosm run examples/world-benchmark.yaml --compose-file /tmp/compose.yml --json
# If the task has not been materialized, the run fails with a clear error naming the roots it searched.
name: world-benchmark
mode: comparison
model:
  id: qwen3-4b
  hf_repo: Qwen/Qwen3-4B-Instruct-2507
gateway:
  url: http://172.30.1.2:8080
  run_label: world-benchmark
  api_key: mesocosm-local
agents:
  - id: agent-1
    harness: opencode
    url: http://172.30.1.10:4096
    budget:
      completion_tokens: 120000
      requests: 500
    tools: {todowrite: false, question: false}
    persona:
      username: jkim
      name: Jae Kim
      hostname: jkim-dev
      brief: |
        You are Jae Kim (username `jkim`), a backend engineer. You pick up tickets from the queue and fix them.
  - id: agent-2
    harness: opencode
    url: http://172.30.2.11:4096
    budget:
      completion_tokens: 120000
      requests: 500
    tools: {todowrite: false, question: false}
    persona:
      username: mlee
      name: Min Lee
      hostname: mlee-dev
      brief: |
        You are Min Lee (username `mlee`), a backend engineer. You pick up tickets from the queue and fix them.
tasks:
  - source: harbor
    dataset: terminal-bench@2.0/fix-git     # imported by reference; materialize it with Harbor first
    name: fix-git
memory: reset
isolate_agents: true
observe:
  activations: false
