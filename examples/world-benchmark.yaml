# Three independent agents on an external benchmark task (ADR-0037).
# The task is a real Terminal-Bench 2.0 task; Harbor materializes it, Mesocosm imports the directory.
#
# Follow docs/native-multiagent.md to materialize the task, replace the control key, and start
# the native runtime. This configuration isolates the agents from each other and disables services.
# If the task has not been materialized, the run fails with a clear error naming the roots it searched.
name: world-benchmark
mode: comparison
model:
  id: qwen3-4b
  hf_repo: Qwen/Qwen3-4B-Instruct-2507
gateway:
  url: http://172.30.1.2:8080
  run_label: world-benchmark
  api_key: replace-with-a-fresh-random-control-key
agents:
  - id: agent-1
    harness: opencode
    url: http://172.30.1.10:4096
    budget:
      completion_tokens: 120000
      requests: 500
    tools: {todowrite: false, question: false}
  - id: agent-2
    harness: opencode
    url: http://172.30.2.11:4096
    budget:
      completion_tokens: 120000
      requests: 500
    tools: {todowrite: false, question: false}
  - id: agent-3
    harness: opencode
    url: http://172.30.3.12:4096
    budget:
      completion_tokens: 120000
      requests: 500
    tools: {todowrite: false, question: false}
tasks:
  - source: harbor
    dataset: terminal-bench@2.0/fix-git     # imported by reference; materialize it with Harbor first
    name: fix-git
memory: reset
isolate_agents: true
services:
  enabled: false
observe:
  activations: false
