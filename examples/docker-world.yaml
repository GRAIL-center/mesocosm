# Two agents in the Docker sandbox topology, each on its own network (isolate_agents: true).
# Addresses are as seen from the control container (`mesocosm env compose` renders the topology):
#   uv run mesocosm env compose examples/docker-world.yaml --out /tmp/compose.yml --run-label docker-world
#   docker compose -f /tmp/compose.yml up -d --build
#   docker compose -f /tmp/compose.yml exec -T agent-1 egress-check
name: docker-world
mode: comparison
model:
  id: mesocosm-3b
  hf_repo: Qwen/Qwen3-4B-Instruct-2507
gateway:
  url: http://gateway:8080
  api_key: mesocosm-local
agents:
  - id: agent-1
    harness: opencode
    budget:
      completion_tokens: 40000
      requests: 200
  - id: agent-2
    harness: opencode
    budget:
      completion_tokens: 40000
      requests: 200
tasks:
  - source: harbor
    path: tasks/hello-world
memory: reset
isolate_agents: true
observe:
  activations: false
