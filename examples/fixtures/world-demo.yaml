# Legacy authored fixture; see examples/fixtures/README.md. Not evidence of emergent behavior.
# Two isolated agents that can only meet through the world services (board, wiki, git, pypi).
# Addresses are the fixed ones the compose renderer assigns, so the control plane can run on the
# Docker host (inside rootless Docker's network namespace on Colab, see spike/colab_docker_setup.sh):
#   uv run mesocosm env compose examples/fixtures/world-demo.yaml --out /tmp/compose.yml --run-label world-demo [--vllm-host 10.0.2.2]
#   docker compose -f /tmp/compose.yml up -d --build
#   uv run mesocosm run examples/fixtures/world-demo.yaml --compose-file /tmp/compose.yml --json --task-runtime fixture --verifier-image <image>
name: world-demo
mode: comparison
model:
  id: qwen3-4b
  hf_repo: Qwen/Qwen3-4B-Instruct-2507
gateway:
  url: http://172.30.1.2:8080
  run_label: world-demo
  api_key: mesocosm-local
agents:
  - id: agent-1
    harness: opencode
    url: http://172.30.1.10:4096
    budget:
      completion_tokens: 60000
      requests: 300
  - id: agent-2
    harness: opencode
    url: http://172.30.2.11:4096
    budget:
      completion_tokens: 60000
      requests: 300
tasks:
  - source: harbor
    path: tasks/board-exchange
memory: reset
isolate_agents: true
services:
  enabled: true
  wiki: {docs: ../../spike/world/wiki}  # explicitly opt into the legacy service guide
  git: [project]
channels: []
