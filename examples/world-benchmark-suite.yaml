# A benchmark split run as a shared work queue: three agents take real benchmark tasks one at a time from one
# collection, no task authored by us (ADR-0040). `dataset: terminal-bench@2.0` expands to every task Harbor
# materialized under that collection; `limit` caps how many. Any benchmark in the standard task layout works
# the same way (Terminal-Bench, SWE-bench, ...).
#
# Materialize the selected task directories under MESOCOSM_TASKS_ROOT and follow
# docs/native-multiagent.md for the native runtime and a fresh control key. Every selected task
# must satisfy the native runtime support profile; importing a collection does not establish that.
name: world-benchmark-suite
mode: persistent
model:
  id: qwen3-4b
  hf_repo: Qwen/Qwen3-4B-Instruct-2507
gateway:
  url: http://172.30.1.2:8080
  run_label: world-benchmark-suite
  api_key: replace-with-a-fresh-random-control-key
agents:
  - id: agent-1
    harness: opencode
    url: http://172.30.1.10:4096
    budget: {completion_tokens: 120000, requests: 500}
    tools: {todowrite: false, question: false}
  - id: agent-2
    harness: opencode
    url: http://172.30.2.11:4096
    budget: {completion_tokens: 120000, requests: 500}
    tools: {todowrite: false, question: false}
  - id: agent-3
    harness: opencode
    url: http://172.30.3.12:4096
    budget: {completion_tokens: 120000, requests: 500}
    tools: {todowrite: false, question: false}
tasks:
  - source: harbor
    dataset: terminal-bench@2.0     # a whole collection; expands to all its materialized tasks
    limit: 20                       # take the first 20 (sorted); omit to take the whole split
stream:
  idle_stop_seconds: 120            # end once the queue drains and the agents go idle
memory: reset                       # each benchmark task is independent; one agent per task from the queue
isolate_agents: true
services:
  enabled: false
