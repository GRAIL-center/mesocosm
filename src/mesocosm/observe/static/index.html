<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesocosm observe</title>
<link rel="icon" href="data:,">
<script src="/static/sprites.js"></script>
<style>
  /* Forest palette (ADR-0032): parchment and moss by day, pine and lamplight by night. */
  @font-face { font-family: Silkscreen; src: url(/static/fonts/silkscreen-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: Silkscreen; src: url(/static/fonts/silkscreen-latin-700-normal.woff2) format('woff2'); font-weight: 700; font-display: swap; }
  :root {
    --bg: #ece3c8; --panel: #f8f1dc; --panel2: #f1e7cb; --ink: #2b2118; --muted: #7b6a52; --line: #d8c9a3; --line2: #a8916a;
    --idle: #9c927c; --busy: #3d8db8; --tool: #c98418; --blocked: #c4442f; --error: #c4442f; --done: #4f8a36;
    --accent: #4f8a36; --info: #5f8aa6; --off: #b9ad92; --ground: #6b8f3e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --pixel: Silkscreen, ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1913; --panel: #16231b; --panel2: #1c2c22; --ink: #ece5cc; --muted: #93a28a; --line: #2a3a2f; --line2: #4a6352;
            --idle: #6f7c69; --busy: #5cb2dd; --tool: #e6a63c; --blocked: #e2604a; --error: #e2604a; --done: #7dc05a;
            --accent: #7dc05a; --info: #7fa6bf; --off: #3f4d42; --ground: #2f4a26; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; }
  img.spr, .spr { image-rendering: pixelated; image-rendering: crisp-edges; }
  /* a pixel frame: square corners cut one step in */
  .px { clip-path: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px),
                           calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px)); }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 20px; border-bottom: 2px solid var(--line2);
           background: var(--panel); position: sticky; top: 0; z-index: 3; }
  header h1 { font: 700 16px/1 var(--pixel); margin: 0; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  header h1 img { width: 32px; height: 32px; }
  header .meta { color: var(--muted); display: flex; gap: 14px; align-items: center; flex: 1; min-width: 0; white-space: nowrap;
                 font: 8px/1 var(--pixel); text-transform: uppercase; }
  header code { font: 8px var(--pixel); }
  #treeline { height: 32px; background-repeat: repeat-x; background-size: 32px 32px; background-position: 6px 0;
              image-rendering: pixelated; border-bottom: 4px solid var(--ground); opacity: .9; }
  .dot { width: 8px; height: 8px; background: var(--idle); display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .dot.on { background: var(--done); }
  button { font: 8px/1 var(--pixel); text-transform: uppercase; color: var(--ink); background: var(--panel2); border: 2px solid var(--line2);
           padding: 6px 10px; cursor: pointer; box-shadow: 0 2px 0 var(--line2); }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(2px); box-shadow: none; }
  button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  #scrub { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-bottom: 2px solid var(--line);
           background: var(--panel); color: var(--muted); font: 8px var(--pixel); text-transform: uppercase; }
  #scrub input[type=range] { flex: 1; accent-color: var(--accent); }

  /* ---- the constraint board ---- */
  #board { background: var(--panel); border-bottom: 2px solid var(--line2); padding: 10px 20px 12px; }
  #board .bhead { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; font: 8px var(--pixel); text-transform: uppercase; color: var(--muted); }
  #board .bhead b { font: 700 8px var(--pixel); color: var(--ink); letter-spacing: 1px; }
  #board .bhead .keys { display: flex; gap: 12px; flex: 1; flex-wrap: wrap; }
  #board .groups { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .group .gname { font: 8px var(--pixel); text-transform: uppercase; color: var(--muted); margin: 0 0 5px 2px; letter-spacing: 1px; }
  .group .tiles { display: flex; flex-wrap: wrap; gap: 6px; }
  .tile { position: relative; display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto auto; column-gap: 8px;
          width: 184px; height: 62px; padding: 5px 8px 5px 6px; text-align: left; text-transform: none; font: inherit;
          background: var(--panel2); border: 2px solid var(--line2); box-shadow: 0 2px 0 var(--line2); align-content: center; }
  .tile img.spr { grid-row: 1 / span 3; width: 40px; height: 40px; align-self: center; }
  .tile .tt { font: 8px/1.2 var(--pixel); text-transform: uppercase; color: var(--muted); letter-spacing: .5px; padding-right: 12px; white-space: nowrap; overflow: hidden; }
  .tile .tv { font: 16px/1.15 var(--pixel); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .tn { font: 8px/1.3 var(--pixel); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lamp { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; background: var(--idle); box-shadow: 0 0 0 2px var(--panel2); }
  .s-ok .lamp, .lamp.s-ok { background: var(--done); } .s-warn .lamp, .lamp.s-warn { background: var(--tool); }
  .s-breach .lamp, .lamp.s-breach { background: var(--error); } .s-info .lamp, .lamp.s-info { background: var(--info); }
  .s-off .lamp, .lamp.s-off { background: var(--off); } .s-pending .lamp, .lamp.s-pending { background: var(--idle); animation: blink 1s steps(2) infinite; }
  .tile.s-breach { border-color: var(--error); box-shadow: 0 2px 0 var(--error); }
  .tile.s-warn { border-color: var(--tool); box-shadow: 0 2px 0 var(--tool); }
  .tile.s-off { background: transparent; border-style: dashed; box-shadow: none; }
  .tile.s-off img.spr { filter: grayscale(1); opacity: .45; }
  .tile.s-off .tv { color: var(--muted); }
  #board .tile.selected { border-color: var(--accent); border-style: solid; box-shadow: 0 2px 0 var(--accent);
                          background: color-mix(in srgb, var(--accent) 16%, var(--panel2)); }
  @keyframes blink { 50% { opacity: .2; } }
  .meter { display: flex; gap: 2px; margin-top: 3px; }
  .meter i { width: 10px; height: 6px; background: var(--line); display: block; }
  .meter i.on { background: var(--done); }
  .s-warn .meter i.on, .meter.s-warn i.on { background: var(--tool); } .s-breach .meter i.on, .meter.s-breach i.on { background: var(--error); }
  .s-info .meter i.on, .meter.s-info i.on { background: var(--info); }
  /* folded: one row of sprites with their lamps */
  #board.folded .tile { width: 40px; height: 52px; padding: 2px 2px 12px; grid-template-columns: 1fr; }
  #board.folded .tile img.spr { width: 32px; height: 32px; grid-row: auto; justify-self: center; }
  #board.folded .tile .tt, #board.folded .tile .tv, #board.folded .tile .tn, #board.folded .tile .meter { display: none; }
  #board.folded .tile .lamp { top: auto; bottom: 3px; right: calc(50% - 4px); }
  #board.folded .gname { display: none; }
  #board.folded .groups { gap: 6px 14px; }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #graph.dragging { cursor: grabbing; }
  #empty { color: var(--muted); padding: 40px 20px; position: absolute; top: 0; left: 0; font: 8px var(--pixel); text-transform: uppercase;
           display: flex; align-items: center; gap: 12px; }
  #empty img { width: 48px; height: 48px; }
  #empty[hidden] { display: none; }
  .n { cursor: pointer; }
  .n .ring { fill: var(--panel); stroke-width: 4; stroke: var(--idle); transition: stroke .3s; }
  .n.busy .ring { stroke: var(--busy); } .n.tool .ring { stroke: var(--tool); }
  .n.blocked .ring, .n.error .ring { stroke: var(--error); } .n.done .ring { stroke: var(--done); }
  .n .flag rect { fill: var(--error); stroke: var(--bg); stroke-width: 2; } .n .flag text { fill: #fff; font: 700 8px var(--pixel); text-anchor: middle; dominant-baseline: middle; }
  .n.busy .ring, .n.tool .ring { animation: pulse 1.2s steps(2) infinite; }
  .n.selected .ring { stroke-width: 6; }
  .n .halo { fill: none; stroke: var(--accent); stroke-opacity: 0; stroke-width: 2; stroke-dasharray: 4 4; }
  .n:hover .halo { stroke-opacity: .7; }
  .n .label { font: 8px var(--pixel); text-transform: uppercase; fill: var(--ink); text-anchor: middle; }
  .n .sum { font: 11px system-ui, sans-serif; fill: var(--muted); text-anchor: middle; }
  .n .sum.now { fill: var(--ink); font-size: 12px; }
  .n .ai { fill: var(--accent); font-size: 10px; }
  .n image { image-rendering: pixelated; }
  .edge { fill: none; stroke: var(--line2); stroke-width: 2; stroke-dasharray: 2 4; }
  .sep { stroke: var(--line2); stroke-dasharray: 4 8; stroke-opacity: .6; }
  .flow { fill: none; stroke: var(--done); stroke-width: 2; stroke-opacity: .7; }
  .flow.recent { stroke-width: 3; stroke-opacity: 1; }
  .arrowhead { fill: var(--done); }
  .flowlabel { font: 8px var(--pixel); text-transform: uppercase; fill: var(--done); }
  .edge.live { stroke: var(--busy); stroke-opacity: .8; }
  @keyframes pulse { 50% { stroke-opacity: .35; } }
  #legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 12px; font: 8px var(--pixel); text-transform: uppercase; color: var(--muted);
            background: color-mix(in srgb, var(--panel) 90%, transparent); padding: 8px 10px; border: 2px solid var(--line2); }
  #legend i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; vertical-align: -1px; }
  #fit { position: absolute; right: 14px; bottom: 12px; }
  .badge { display: inline-block; font: 8px/1 var(--pixel); text-transform: uppercase; padding: 4px 6px; color: #fff; background: var(--idle); vertical-align: middle; }
  .badge.busy { background: var(--busy); } .badge.tool, .badge.warn { background: var(--tool); } .badge.blocked, .badge.error, .badge.breach { background: var(--error); }
  .badge.done, .badge.ok { background: var(--done); } .badge.info { background: var(--info); } .badge.off, .badge.pending { background: var(--idle); }
  #drawer { width: 0; border-left: 2px solid var(--line2); background: var(--panel); overflow: hidden; transition: width .2s steps(6); display: flex; flex-direction: column; }
  #drawer.open { width: 520px; }
  #drawer .dhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 2px solid var(--line); }
  #drawer .dhead h2 { font: 700 8px/1.4 var(--pixel); text-transform: uppercase; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 2px solid var(--line); }
  .tabs button { border: none; border-bottom: 2px solid transparent; background: none; padding: 6px 10px; color: var(--muted); box-shadow: none; }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs:empty { display: none; }
  #dbody { padding: 12px 16px; overflow: auto; flex: 1; min-height: 0; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 10px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .row { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row .when { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .msg { border: 2px solid var(--line); margin: 8px 0; overflow: hidden; }
  .msg summary { padding: 6px 10px; cursor: pointer; background: color-mix(in srgb, var(--line) 50%, transparent); font-size: 12px; }
  .msg pre { margin: 0; padding: 10px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
  .role-system summary { border-left: 4px solid var(--muted); } .role-user summary { border-left: 4px solid var(--done); }
  .role-assistant summary { border-left: 4px solid var(--busy); } .role-tool summary { border-left: 4px solid var(--tool); }
  .reasoning pre { background: color-mix(in srgb, var(--tool) 8%, transparent); }
  .clickable { cursor: pointer; color: var(--accent); }
  .muted { color: var(--muted); }
  pre.block { font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: color-mix(in srgb, var(--line) 50%, transparent); padding: 8px; margin: 4px 0; max-height: 300px; overflow: auto; }
  /* constraint drawer */
  .chero { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
  .chero img { width: 64px; height: 64px; }
  .chero .tv { font: 16px/1.2 var(--pixel); } .chero .tn { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ctable { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  .ctable td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
  .ctable td.who { white-space: nowrap; width: 1%; font: 8px var(--pixel); text-transform: uppercase; }
  .ctable td.who img { width: 24px; height: 24px; vertical-align: middle; margin-right: 6px; }
  .ctable td.lampcell { width: 14px; } .ctable .lamp { position: static; display: inline-block; box-shadow: none; }
  h3.cap { font: 8px var(--pixel); text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; letter-spacing: 1px; }
</style>
</head>
<body>
<header>
  <h1><img class="spr" data-sprite="jar" alt="">Mesocosm</h1>
  <div class="meta">
    <span><span id="conn" class="dot"></span><span id="mode">connecting</span></span>
    <code id="runid">–</code>
    <span id="runstatus" class="badge idle">–</span>
    <span id="elapsed" class="muted"></span>
    <span id="counts" class="muted"></span>
  </div>
  <button id="livebtn" class="primary" hidden>Back to live</button>
</header>
<div id="treeline" aria-hidden="true"></div>
<section id="board" aria-label="constraints">
  <div class="bhead"><b>Constraints</b><span class="keys">
    <span><i class="lamp s-ok" style="position:static;display:inline-block"></i> held</span>
    <span><i class="lamp s-warn" style="position:static;display:inline-block"></i> near a limit or pushed</span>
    <span><i class="lamp s-breach" style="position:static;display:inline-block"></i> spent, failed or sprung</span>
    <span><i class="lamp s-info" style="position:static;display:inline-block"></i> tracked, no limit</span>
    <span><i class="lamp s-pending" style="position:static;display:inline-block"></i> not confirmed yet</span>
    <span><i class="lamp s-off" style="position:static;display:inline-block"></i> not in this world</span></span>
    <button id="fold" title="fold the board to one row of sprites">fold</button></div>
  <div class="groups" id="groups"></div>
</section>
<div id="scrub" hidden>
  <span id="scrub-label">history</span>
  <input id="scrub-range" type="range" min="0" max="1000" value="1000" step="1">
  <span id="scrub-time" class="muted"></span>
</div>
<main>
  <section id="stage">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path></marker></defs><g id="view"></g></svg>
    <div id="empty"><img class="spr" data-sprite="jar" alt="">Waiting for the first event…</div>
    <div id="legend"><span><i style="background:var(--idle)"></i>idle</span><span><i style="background:var(--busy)"></i>waiting for model</span>
      <span><i style="background:var(--tool)"></i>running a tool</span><span><i style="background:var(--error)"></i>blocked / error</span>
      <span><i style="background:var(--done)"></i>done</span><span>→ read another agent's post</span><span id="legend-ai" hidden>✦ line written by the model</span></div>
    <button id="fit" title="fit width; wheel scrolls, Ctrl+wheel zooms">fit</button>
  </section>
  <aside id="drawer">
    <div class="dhead"><h2 id="dtitle"></h2><span id="dbadge" class="badge idle"></span><button id="dclose" title="close">✕</button></div>
    <div class="tabs" id="dtabs"></div>
    <div id="dbody"></div>
  </aside>
</main>
<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtTime = ts => ts ? new Date(ts * 1000).toLocaleTimeString([], {hour12: false}) : '';
  const ago = ts => ts ? Math.max(0, Math.round(Date.now() / 1000 - ts)) + 's ago' : '';
  const dur = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), h = Math.floor(m / 60);
    return h ? `${h}h ${m % 60}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };

  // ---- sprites (static/sprites.js): logo, favicon, the tree line ----
  const S = window.MesoSprites;
  document.querySelectorAll('img[data-sprite]').forEach(img => { img.src = S.url(img.dataset.sprite); });
  document.querySelector('link[rel=icon]').href = S.url('jar');
  $('#treeline').style.backgroundImage = `url(${S.url('tree')})`;
  const critterOf = id => { const i = (state?.agents || []).findIndex(a => a.agent_id === id); return S.url(S.critter(Math.max(0, i))); };

  // ---- state (one object, replaced on every update; nothing accumulates client-side) ----
  let state = null, meta = null, frozen = false, es = null;
  const drawer = { kind: null, id: null, tab: 'overview', lastFetch: 0, cache: null };

  function connect() {
    if (es) es.close();
    es = new EventSource('/events');
    es.addEventListener('state', e => { if (frozen) return; const p = JSON.parse(e.data); meta = p.meta; state = p.state; render(); });
    es.onopen = () => { $('#conn').classList.add('on'); };
    es.onerror = () => { $('#conn').classList.remove('on'); $('#mode').textContent = 'reconnecting'; };
  }

  // ---- graph: tree layout per agent, drawn as SVG nodes and edges (rebuilt from state; no listeners per node) ----
  const R_AGENT = 28, R_SESSION = 17, SLOT = 200, ROW = 160, TOP = 70, LEFT = 150, BLOCK_GAP = 30;
  const clip = (t, n) => { t = String(t ?? ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
  const wrap = (t, n, max) => {   // greedy word wrap into at most `max` lines of ~n chars; the last line is clipped
    const words = String(t ?? '').split(' '), lines = []; let cur = '';
    for (const w of words) { if (cur && (cur + ' ' + w).length > n) { lines.push(cur); cur = w; if (lines.length === max) break; } else cur = cur ? cur + ' ' + w : w; }
    if (lines.length < max && cur) lines.push(cur);
    if (lines.length === max && (cur || words.join(' ').length > lines.join(' ').length)) lines[max - 1] = clip(lines[max - 1] + (cur && lines[max - 1] !== cur ? ' ' + cur : ''), n);
    return lines.length ? lines : [''];
  };
  const view = { k: 1, x: 0, y: 0, fitted: false };

  function layout() {
    // One block per agent, stacked vertically. Inside a block the tree is top-down and left-aligned:
    // a node sits above its first child, siblings share the row to the right, so every agent node
    // lines up in one column and children of one parent are at the same height.
    const S = state.sessions, nodes = [], blocks = [];
    const kidsOf = sid => (S[sid]?.children || []).filter(c => S[c]);
    const measure = sid => { const ks = kidsOf(sid); const w = ks.reduce((acc, k) => acc + measure(k), 0) + Math.max(0, ks.length - 1) * 10;
      S[sid]._w = Math.max(SLOT, w); return S[sid]._w; };
    const place = (sid, x0, y, parent) => {
      const s = S[sid];
      const node = { id: sid, kind: 'session', x: x0 + SLOT / 2, y, parent, status: s.status, source: s.summary_source,
                     label: s.title || (s.parent_id ? 'subagent' : sid), summary: s.summary, r: R_SESSION };
      nodes.push(node); let cx = x0, depth = 1;
      kidsOf(sid).forEach(k => { depth = Math.max(depth, 1 + place(k, cx, y + ROW, node)); cx += S[k]._w + 10; });
      return depth;
    };
    let y = TOP, width = 0;
    state.agents.forEach(a => {
      const roots = a.root_sessions.filter(r => S[r]);
      const tops = roots.length === 1 ? kidsOf(roots[0]) : roots;   // one root session: the agent node stands for it
      tops.forEach(measure);
      const w = Math.max(SLOT, tops.reduce((acc, k) => acc + S[k]._w, 0) + Math.max(0, tops.length - 1) * 10);
      const agent = { id: a.agent_id, kind: 'agent', x: LEFT + SLOT / 2, y, status: a.status, label: a.agent_id, task: a.task,
                      summary: a.summary, source: a.summary_source, r: R_AGENT, flags: a.flags || [],
                      sub: `${a.requests} calls${a.rewards.length ? ' · reward ' + a.rewards.map(r => r.reward ?? 'not measured').join(',') : ''}` };
      nodes.push(agent); let cx = LEFT, depth = 1;
      tops.forEach(k => { depth = Math.max(depth, 1 + place(k, cx, y + ROW, agent)); cx += S[k]._w + 10; });
      const h = depth * ROW; blocks.push({ y: y - TOP / 2, h });
      width = Math.max(width, LEFT + w); y += h + BLOCK_GAP;
    });
    return { nodes, blocks, width: width + 40, height: y };
  }

  // a square frame with its corners cut one step in: the pixel version of a ring
  const frame = (r, cls) => { const c = Math.max(3, Math.round(r / 5));
    return `<path class="${cls}" d="M${-r + c},${-r} H${r - c} V${-r + c} H${r} V${r - c} H${r - c} V${r} H${-r + c} V${r - c} H${-r} V${-r + c} H${-r + c} Z"></path>`; };

  function nodeSvg(n) {
    const sel = drawer.kind === n.kind && drawer.id === n.id ? ' selected' : '';
    const data = n.kind === 'agent' ? `data-agent="${esc(n.id)}"` : `data-session="${esc(n.id)}"`;
    const inner = n.kind === 'agent' ? `<image href="${critterOf(n.id)}" x="-20" y="-20" width="40" height="40"></image>` : '';
    const label = `<text class="label" y="${n.r + 16}">${esc(clip(n.kind === 'agent' ? `${n.label} · ${n.task || ''}` : n.label, 30))}</text>`;
    const y0 = n.r + 31, lines = wrap(n.summary, 30, 2), ai = n.source === 'model' ? '<tspan class="ai">✦ </tspan>' : '';
    const sum = lines.map((l, i) => `<text class="sum now" y="${y0 + i * 14}">${i === 0 ? ai : ''}${esc(l)}</text>`).join('');
    const sub = n.sub ? `<text class="sum" y="${y0 + lines.length * 14}">${esc(n.sub)}</text>` : '';
    const flag = n.flags && n.flags.length ? `<g class="flag" transform="translate(${n.r},${-n.r})"><title>${esc(flagText(n.flags))}</title><rect x="-8" y="-8" width="16" height="16"></rect><text y="1">!</text></g>` : '';
    return `<g class="n ${n.status}${sel}" transform="translate(${n.x},${n.y})" ${data}><title>${esc(n.label)} — ${esc(n.summary)}</title>
      ${frame(n.r + 6, 'halo')}${frame(n.r, 'ring')}${inner}${label}${sum}${sub}${flag}</g>`;
  }
  const flagLine = f => f.summary ? `${f.kind}: ${f.summary}` : `${f.kind === 'trap' ? 'used trap credential' : f.kind} ${f.account || ''} on ${f.service || '?'}${f.note ? ' (' + f.note + ')' : ''}`;
  const flagText = flags => flags.map(flagLine).join('\n');

  const edgeSvg = n => { const p = n.parent, y0 = p.y + p.r + (p.kind === 'agent' ? 54 : 52), y1 = n.y - n.r - 6, my = (y0 + y1) / 2;
    return `<path class="edge${n.status === 'busy' || n.status === 'tool' ? ' live' : ''}" d="M${p.x},${y0} C${p.x},${my} ${n.x},${my} ${n.x},${y1}"></path>`; };

  // Who read whose writing: one arrow per (writer, reader, service), drawn as an arc left of the agent column.
  function interactionsSvg(g) {
    const pos = Object.fromEntries(g.nodes.filter(n => n.kind === 'agent').map(n => [n.id, n]));
    const pairs = new Map();
    (state.interactions || []).forEach(i => { const k = `${i.from}|${i.to}|${i.service}`; const e = pairs.get(k) || { ...i, n: 0 }; e.n++; e.ts = i.ts; pairs.set(k, e); });
    const seen = new Map();   // arcs between the same two agents fan out so their labels stay apart
    return [...pairs.values()].map(e => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return '';
      const pk = `${e.from}|${e.to}`, idx = seen.get(pk) || 0; seen.set(pk, idx + 1);
      const x = a.x - a.r - 8, bulge = Math.max(50, Math.abs(b.y - a.y) / 3) + idx * 34, my = (a.y + b.y) / 2;
      const recent = state.last_ts && e.ts && state.last_ts - e.ts < 30 ? ' recent' : '';
      return `<path class="flow${recent}" d="M${x},${a.y} C${x - bulge},${a.y} ${x - bulge},${b.y} ${x},${b.y}" marker-end="url(#arrow)"></path>
        <text class="flowlabel" x="${x - bulge - 4}" y="${my + idx * 14}" text-anchor="end">${esc(e.service)} ×${e.n}</text>`;
    }).join('');
  }

  function applyView() { $('#view').setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
  function fit(g) {
    const box = $('#graph').getBoundingClientRect();
    view.k = Math.min(1, (box.width - 40) / g.width);
    view.x = 10; view.y = 10; view.fitted = true; applyView();
  }

  function render() {
    if (!state) return;
    $('#mode').textContent = frozen ? 'paused (scrubbing)' : (meta.mode === 'replay' ? `replay ×${meta.replay_speed}${meta.replay_done ? ' · finished' : ''}` : 'live');
    $('#runid').textContent = state.run_id || '–';
    const rs = $('#runstatus'); rs.textContent = state.paused ? state.status + ' · paused' : state.stop_requested && state.status === 'running' ? 'stopping' : state.status;
    rs.className = 'badge ' + (state.paused ? 'tool' : state.status === 'running' ? 'busy' : state.status === 'ok' ? 'done' : 'error');
    $('#counts').textContent = `${state.ingested} records · ${Object.keys(state.sessions).length} sessions · ${state.agents.length} agents`;
    renderBoard();
    $('#empty').hidden = state.agents.length > 0;
    $('#legend-ai').hidden = !(meta && meta.summarizer);
    const g = layout();
    const seps = g.blocks.slice(1).map(b => `<line class="sep" x1="0" x2="${Math.max(g.width, 4000)}" y1="${b.y - BLOCK_GAP / 2}" y2="${b.y - BLOCK_GAP / 2}"></line>`).join('');
    $('#view').innerHTML = seps + g.nodes.filter(n => n.parent).map(edgeSvg).join('') + interactionsSvg(g) + g.nodes.map(nodeSvg).join('');
    if (!view.fitted) fit(g);
    if (meta && (meta.mode === 'replay' || state.started_ts)) {
      $('#scrub').hidden = false;
      const r = $('#scrub-range'); r.min = Math.floor(state.started_ts || 0); r.max = Math.ceil(state.last_ts || r.min + 1);
      if (!frozen) { r.value = r.max; $('#scrub-time').textContent = fmtTime(state.last_ts); }
    }
    maybeRefreshDrawer();
  }

  // pan and zoom on the canvas: state lives in `view`, the SVG content is rebuilt by render()
  (() => {
    const svg = $('#graph'); let drag = null;
    svg.addEventListener('pointerdown', e => { if (e.target.closest('.n')) return; drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; svg.classList.add('dragging'); svg.setPointerCapture(e.pointerId); });
    svg.addEventListener('pointermove', e => { if (!drag) return; view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y; applyView(); });
    const end = () => { drag = null; svg.classList.remove('dragging'); };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    svg.addEventListener('wheel', e => { e.preventDefault();
      if (!(e.ctrlKey || e.metaKey)) { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); return; }   // plain wheel scrolls the list
      const box = svg.getBoundingClientRect(), mx = e.clientX - box.left, my = e.clientY - box.top;
      const k = Math.min(3, Math.max(0.2, view.k * (e.deltaY < 0 ? 1.1 : 0.9)));
      view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k; view.fitted = true; applyView(); }, { passive: false });
    $('#fit').addEventListener('click', () => { view.fitted = false; render(); });
    window.addEventListener('resize', () => { view.fitted = false; render(); });
  })();

  setInterval(() => {   // one clock, started once
    if (!state) return;
    const end = frozen ? Number($('#scrub-range').value) : (state.last_ts || state.started_ts);
    $('#elapsed').textContent = state.started_ts ? `elapsed ${dur(end - state.started_ts)}` : '';
  }, 1000);

  // ---- drawer ----
  const tabsFor = kind => kind === 'session' ? ['overview', 'tools', 'timeline', 'requests'] : kind === 'constraint' ? [] : ['overview', 'requests'];
  function openDrawer(kind, id) { drawer.kind = kind; drawer.id = id; drawer.tab = 'overview'; drawer.cache = null; drawer.lastFetch = 0;
    $('#drawer').classList.add('open'); render(); refreshDrawer(true); }
  function closeDrawer() { drawer.kind = null; drawer.id = null; drawer.cache = null; $('#drawer').classList.remove('open'); $('#dbody').innerHTML = ''; render(); }
  function maybeRefreshDrawer() {
    if (drawer.kind === 'constraint') return drawDrawer();
    if (drawer.kind && !frozen && Date.now() - drawer.lastFetch > 2000) refreshDrawer(false);
  }

  async function refreshDrawer(force) {
    if (!drawer.kind) return;
    if (drawer.kind === 'constraint') { drawer.cache = {}; return drawDrawer(); }
    drawer.lastFetch = Date.now();
    try {
      if (drawer.kind === 'session') drawer.cache = await (await fetch(`/session/${encodeURIComponent(drawer.id)}`)).json();
      else drawer.cache = await (await fetch(`/agent/${encodeURIComponent(drawer.id)}/requests`)).json();
    } catch (e) { drawer.cache = { error: String(e) }; }
    drawDrawer();
  }

  function drawDrawer() {
    const d = drawer.cache; if (!d || !drawer.kind) return;
    if (drawer.kind === 'constraint') return drawConstraint();
    const agent = drawer.kind === 'agent' ? state.agents.find(a => a.agent_id === drawer.id) : null;
    const status = drawer.kind === 'session' ? d.status : agent?.status;
    $('#dtitle').textContent = drawer.kind === 'session' ? `${d.parent_id ? 'subagent ' : 'session '}${d.title || d.session_id}` : `agent ${drawer.id}`;
    const b = $('#dbadge'); b.textContent = status || ''; b.className = 'badge ' + (status || 'idle');
    $('#dtabs').innerHTML = tabsFor(drawer.kind).map(t => `<button data-tab="${t}" class="${drawer.tab === t ? 'active' : ''}">${t}</button>`).join('');
    const body = $('#dbody');
    if (drawer.tab === 'overview') body.innerHTML = overviewHtml(d, agent);
    else if (drawer.tab === 'tools') body.innerHTML = toolsHtml(d.items || []);
    else if (drawer.tab === 'timeline') body.innerHTML = timelineHtml(d.items || []);
    else if (drawer.tab === 'requests') body.innerHTML = requestsHtml(d.requests || [], drawer.kind === 'session' ? d.agent_id : drawer.id);
  }

  function overviewHtml(d, agent) {
    if (agent) {
      const budget = Object.entries(agent.budget || {}).map(([k, v]) => `${k}: ${esc(JSON.stringify(v))}`).join(', ') || 'none';
      return `<dl class="kv"><dt>status</dt><dd>${esc(agent.status)}</dd><dt>now</dt><dd>${esc(agent.summary)}</dd>
        <dt>task</dt><dd>${esc(agent.task || '–')}</dd><dt>budget</dt><dd>${budget}</dd>
        <dt>model calls</dt><dd>${agent.requests} (${agent.completion_tokens} completion tokens)</dd>
        <dt>last call</dt><dd>${fmtTime(agent.last_request_ts)} ${agent.last_request_ts ? '(' + ago(agent.last_request_ts) + ')' : ''}</dd>
        <dt>rewards</dt><dd>${agent.rewards.length ? agent.rewards.map(r => `${esc(r.task)} → ${esc(r.reward)}`).join('<br>') : '–'}</dd>
        <dt>last error</dt><dd>${esc(agent.last_error || '–')}</dd>
        <dt>web</dt><dd>${agent.web ? `${agent.web.requests} requests, ${agent.web.denied} refused` : '–'}</dd>
        <dt>flags</dt><dd>${(agent.flags || []).length ? agent.flags.map(f => `<span class="badge error">${esc(f.kind)}</span> ${esc(fmtTime(f.ts))} ${esc(f.summary || ((f.account || '') + ' on ' + (f.service || '?') + (f.note ? ' · ' + f.note : '')))}`).join('<br>') : '–'}</dd>
        <dt>sessions</dt><dd>${agent.root_sessions.map(s => `<span class="clickable" data-session="${esc(s)}">${esc(s)}</span>`).join('<br>') || '–'}</dd></dl>`;
    }
    const tk = d.tokens || {};
    return `<dl class="kv"><dt>status</dt><dd>${esc(d.status)}</dd><dt>now</dt><dd>${esc(d.summary)}</dd>
      <dt>agent</dt><dd>${esc(d.agent_id || '?')}</dd><dt>parent</dt><dd>${d.parent_id ? `<span class="clickable" data-session="${esc(d.parent_id)}">${esc(d.parent_id)}</span>` : 'root session'}</dd>
      <dt>subagents</dt><dd>${(d.children || []).map(s => `<span class="clickable" data-session="${esc(s)}">${esc(s)}</span>`).join('<br>') || '–'}</dd>
      <dt>created</dt><dd>${fmtTime(d.created_ts)}</dd><dt>updated</dt><dd>${fmtTime(d.updated_ts)} ${d.updated_ts ? '(' + ago(d.updated_ts) + ')' : ''}</dd>
      <dt>tool calls</dt><dd>${d.tool_calls}</dd><dt>text parts</dt><dd>${d.text_parts}</dd>
      <dt>tokens</dt><dd>${tk.input != null ? `in ${tk.input} · out ${tk.output} · reasoning ${tk.reasoning ?? 0}` : '–'}</dd>
      <dt>error</dt><dd>${esc(d.error || '–')}</dd></dl>
      ${d.live_text ? `<p class="muted" style="margin-top:12px">streaming text</p><pre class="block">${esc(d.live_text)}</pre>` : ''}`;
  }

  // ---- the constraint board: one tile per limit of the world, a drawer per tile ----
  const STATE_WORDS = { ok: 'held', warn: 'near a limit', breach: 'spent / sprung', info: 'tracked', pending: 'not confirmed', off: 'not in this world' };
  const GROUP_NAMES = { fences: 'Fences', supplies: 'Supplies', conditions: 'Conditions', watchers: 'Watchers' };
  const meterHtml = (m, st, cells = 10) => {
    if (!m || !m.limit) return '';
    const on = Math.min(cells, Math.round(cells * Math.min(1, m.used / m.limit)) || (m.used > 0 ? 1 : 0));
    return `<span class="meter s-${st}">${Array.from({ length: cells }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('')}</span>`;
  };
  let boardKey = '';
  function renderBoard() {
    const items = state.constraints || [];
    const key = JSON.stringify(items.map(c => [c.key, c.state, c.value, c.note, c.meter, c.sprite])) + (drawer.kind === 'constraint' ? drawer.id : '');
    if (key === boardKey) return;           // nothing on the board changed: leave the DOM alone
    boardKey = key;
    const groups = {};
    items.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
    $('#groups').innerHTML = Object.keys(GROUP_NAMES).filter(g => groups[g]).map(g => `<div class="group"><div class="gname">${GROUP_NAMES[g]}</div><div class="tiles">${
      groups[g].map(c => `<button class="tile px s-${c.state}${drawer.kind === 'constraint' && drawer.id === c.key ? ' selected' : ''}" data-constraint="${esc(c.key)}"
        title="${esc(c.title)}: ${esc(c.value)}${c.note ? ' — ' + esc(c.note) : ''} (${STATE_WORDS[c.state] || c.state})">
        <img class="spr" src="${S.url(c.sprite)}" alt=""><span class="lamp"></span>
        <span class="tt">${esc(c.title)}</span><span class="tv">${esc(c.value)}</span>
        ${c.meter && c.meter.limit ? meterHtml(c.meter, c.state) : `<span class="tn">${esc(c.note)}</span>`}</button>`).join('')}</div></div>`).join('');
  }
  (() => {   // folded or not: a per-viewer convenience, kept in this browser only
    const board = $('#board'); let folded = false;
    try { folded = localStorage.getItem('mesocosm.board.folded') === '1'; } catch (e) { /* storage blocked: default */ }
    board.classList.toggle('folded', folded); $('#fold').textContent = folded ? 'unfold' : 'fold';
    $('#fold').addEventListener('click', () => { folded = !folded; board.classList.toggle('folded', folded);
      $('#fold').textContent = folded ? 'unfold' : 'fold';
      try { localStorage.setItem('mesocosm.board.folded', folded ? '1' : '0'); } catch (e) { /* ignore */ }
      view.fitted = false; render(); });
  })();

  function drawConstraint() {
    const c = (state.constraints || []).find(x => x.key === drawer.id);
    if (!c) { $('#dbody').innerHTML = '<p class="muted">no such constraint</p>'; return; }
    $('#dtitle').textContent = c.title;
    const b = $('#dbadge'); b.textContent = STATE_WORDS[c.state] || c.state; b.className = 'badge ' + c.state;
    $('#dtabs').innerHTML = '';
    const rows = (c.rows || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
    const agents = (c.agents || []).map(a => `<tr><td class="lampcell"><i class="lamp s-${esc(a.state)}"></i></td>
      <td class="who"><img class="spr" src="${critterOf(a.agent_id)}" alt="">${esc(a.agent_id)}</td>
      <td>${esc(a.value)}${a.meter && a.meter.limit ? meterHtml(a.meter, a.state, 16) : ''}</td></tr>`).join('');
    $('#dbody').innerHTML = `<div class="chero"><img class="spr" src="${S.url(c.sprite)}" alt="">
        <div><div class="tv">${esc(c.value)}</div><div class="tn">${esc(c.note)}</div>${c.meter && c.meter.limit ? meterHtml(c.meter, c.state, 20) : ''}</div></div>
      ${rows ? `<dl class="kv">${rows}</dl>` : ''}
      ${agents ? `<h3 class="cap">Per agent</h3><table class="ctable">${agents}</table>` : ''}`;
  }

  function toolsHtml(items) {
    const tools = items.filter(i => i.kind === 'tool');
    if (!tools.length) return '<p class="muted">no tool calls yet</p>';
    return tools.map(t => `<details class="msg role-tool"><summary><span class="when">${fmtTime(t.ts)}</span> &nbsp;<b>${esc(t.tool)}</b> ${esc(t.input_summary || '')} <span class="badge ${t.status === 'completed' ? 'done' : t.status === 'error' ? 'error' : 'tool'}">${esc(t.status)}</span></summary>
      <pre>${esc(t.title ? t.title + '\n' : '')}${esc(t.output ?? t.error ?? '(no output yet)')}</pre></details>`).join('');
  }

  function timelineHtml(items) {
    if (!items.length) return '<p class="muted">nothing yet</p>';
    return items.map(i => {
      let text = i.kind === 'tool' ? `<b>${esc(i.tool)}</b> ${esc(i.input_summary || '')} · ${esc(i.status)}`
        : i.kind === 'file' ? `edited <b>${esc(i.path)}</b>` : i.kind === 'reasoning' ? `<i>thinking:</i> ${esc(i.text)}`
        : i.kind === 'service' ? `<b>${esc(i.service)}</b> ${esc(i.op)}${i.key != null ? ' #' + esc(i.key) : ''}${i.to ? ' → ' + esc(i.to) : ''}${i.account ? ' as ' + esc(i.account) : ''}${i.summary ? ' · ' + esc(i.summary) : ''}`
        : i.kind === 'web' ? `<b>${esc(i.host)}</b> ${esc(i.method || '')} ${esc(i.path || '')} · ${esc(i.decision)}${i.status ? ' ' + esc(i.status) : ''}${i.bytes ? ' · ' + esc(i.bytes) + ' B' : ''}` : esc(i.text);
      const refused = i.kind === 'web' && /^denied/.test(i.decision || '');
      return `<div class="row"><span class="when">${fmtTime(i.ts)}</span> <span class="badge ${i.kind === 'error' || refused ? 'error' : i.kind === 'tool' ? 'tool' : 'idle'}">${esc(i.kind)}</span> ${text}</div>`;
    }).join('');
  }

  function requestsHtml(reqs, agentId) {
    if (!reqs.length) return `<p class="muted">no model requests recorded${drawer.kind === 'session' ? ' for this session (matched by time; see the agent view for all)' : ''}</p>`;
    return reqs.slice().reverse().map(r => `<div class="row"><span class="when">${fmtTime(r.ts)}</span>
      <span class="clickable" data-request="${esc(r.request_id)}" data-agent="${esc(agentId)}">${esc(r.event)} ${r.status}</span>
      · ${r.n_messages ?? '?'} msgs · ${r.latency_ms ?? '?'} ms · ${r.prompt_tokens ?? '?'}→${r.completion_tokens ?? '?'} tok
      ${r.tool_calls?.length ? '· tools ' + esc(r.tool_calls.join(',')) : ''} ${r.reasoning_chars ? '· CoT ' + r.reasoning_chars + ' chars' : ''}
      ${r.has_token_ids ? '· ids' : ''}<div id="req-${esc(r.request_id)}"></div></div>`).join('');
  }

  async function expandRequest(agentId, rid) {
    const slot = document.getElementById(`req-${rid}`); if (!slot) return;
    if (slot.innerHTML) { slot.innerHTML = ''; return; }
    slot.innerHTML = '<p class="muted">loading…</p>';
    const res = await fetch(`/request/${encodeURIComponent(agentId)}/${encodeURIComponent(rid)}`);
    if (!res.ok) { slot.innerHTML = `<p class="muted">${esc((await res.json()).detail || res.statusText)}</p>`; return; }
    const rec = await res.json(); const req = rec.request || {}, resp = rec.response || {};
    const msgs = (req.messages || []).map((m, i) => {
      const content = typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 1);
      const calls = (m.tool_calls || []).map(c => `\n[tool_call ${c.function?.name}] ${c.function?.arguments || ''}`).join('');
      return `<details class="msg role-${esc(m.role)}" ${i === (req.messages || []).length - 1 ? 'open' : ''}><summary>${i + 1}. ${esc(m.role)} ${m.tool_call_id ? '(result of ' + esc(m.tool_call_id) + ')' : ''} · ${(content || '').length} chars</summary><pre>${esc(content)}${esc(calls)}</pre></details>`;
    }).join('');
    const tools = (req.tools || []).map(t => t.function?.name).filter(Boolean);
    const calls = (resp.tool_calls || []).map(c => `[${c.function?.name}] ${c.function?.arguments || ''}`).join('\n');
    slot.innerHTML = `<p class="muted">what the model saw · model ${esc(req.model)} · temperature ${esc(req.temperature ?? 'default')} · tools offered: ${esc(tools.join(', ') || 'none')}</p>${msgs}
      <p class="muted">what the model answered · finish ${esc(resp.finish_reason)} · token ids ${resp.prompt_token_ids ? 'recorded' : 'absent'}</p>
      ${resp.reasoning ? `<details class="msg reasoning" open><summary>reasoning (CoT) · ${resp.reasoning.length} chars</summary><pre>${esc(resp.reasoning)}</pre></details>` : '<p class="muted">no separate reasoning field in this response</p>'}
      ${resp.content ? `<details class="msg role-assistant" open><summary>content</summary><pre>${esc(resp.content)}</pre></details>` : ''}
      ${calls ? `<details class="msg role-tool" open><summary>tool calls</summary><pre>${esc(calls)}</pre></details>` : ''}`;
  }

  // ---- scrubbing: ask the server for the state at a time; nothing is kept client-side ----
  let scrubTimer = null;
  $('#scrub-range').addEventListener('input', e => {
    frozen = true; $('#livebtn').hidden = false; $('#scrub-time').textContent = fmtTime(Number(e.target.value));
    clearTimeout(scrubTimer);
    scrubTimer = setTimeout(async () => {
      const p = await (await fetch(`/state?at=${e.target.value}`)).json(); meta = p.meta; state = p.state; render();
    }, 150);
  });
  $('#livebtn').addEventListener('click', () => { frozen = false; $('#livebtn').hidden = true; connect(); });

  // ---- one delegated click handler for everything ----
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab], [data-session], [data-request], [data-agent], [data-constraint], #dclose');
    if (!t) return;
    if (t.id === 'dclose') return closeDrawer();
    if (t.dataset.constraint) return openDrawer('constraint', t.dataset.constraint);
    if (t.dataset.tab) { drawer.tab = t.dataset.tab; return drawDrawer(); }
    if (t.dataset.request) return expandRequest(t.dataset.agent, t.dataset.request);
    if (t.dataset.session) return openDrawer('session', t.dataset.session);
    if (t.dataset.agent) return openDrawer('agent', t.dataset.agent);
  });

  connect();
})();
</script>
</body>
</html>
