<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mesocosm banner</title>
<link rel="stylesheet" href="figures.css">
<script src="../../../src/mesocosm/observe/static/sprites.js"></script>
<style>
  #figure { width: 960px; height: 212px; background: linear-gradient(var(--sky), var(--sky2)); }
  .title { position: absolute; left: 0; right: 0; top: 26px; display: flex; align-items: center; justify-content: center;
           gap: 18px; }
  .title img { width: 96px; height: 96px; }
  .title h1 { margin: 0; font: 700 58px/1 var(--pixel); letter-spacing: 5px; color: var(--ink); }
  .title p { margin: 8px 0 0 4px; font: 17px/1.3 var(--text); color: var(--muted); }
  .layer { position: absolute; left: 0; right: 0; bottom: 0; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background-size: 32px 32px;
            image-rendering: pixelated; border-top: 3px solid var(--ground); }
  .layer img { position: absolute; image-rendering: pixelated; }
  .star { position: absolute; width: 3px; height: 3px; background: var(--trail); display: none; }
  @media (prefers-color-scheme: dark) { .star { display: block; opacity: .7; } .back { filter: brightness(.7); } }
</style>
</head>
<body>
<div id="figure" class="fig">
  <div id="sky"></div>
  <div class="layer back" id="back"></div>
  <div class="layer" id="front"></div>
  <div class="ground" id="ground"></div>
  <div class="title">
    <img class="spr" id="jar" alt="">
    <div><h1>MESOCOSM</h1><p>A sealed world for AI agents. Vary the conditions, record everything.</p></div>
  </div>
</div>
<script type="module">
  const S = window.MesoSprites;
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  document.getElementById('jar').src = S.url('jar', 6);
  document.getElementById('ground').style.backgroundImage =
    `url(${S.tile('meadow', { 1: css('--meadow'), 2: css('--meadow2'), 3: css('--meadow3') }, 2)})`;
  const put = (layer, name, left, bottom, size) => {
    const i = new Image(); i.src = S.url(name, size / 16); i.alt = '';
    Object.assign(i.style, { left: `${left}px`, bottom: `${bottom}px`, width: `${size}px`, height: `${size}px` });
    document.getElementById(layer).appendChild(i);
  };
  // a back row of woods, then a few trees, critters and flowers on the ground in front
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let x = -8; x < 960; x += 22) put('back', rnd() < 0.6 ? 'tree' : 'oak', x, 16 + Math.round(rnd() * 6), 32);
  const front = [['tree', 18, 48], ['oak', 70, 48], ['hedgehog', 150, 32], ['flowers', 205, 32], ['amanita', 268, 32],
                 ['squirrel', 330, 32], ['bush', 390, 32], ['frog', 560, 32], ['mushroom', 618, 32],
                 ['flowers', 680, 32], ['deer', 742, 48], ['stump', 810, 32], ['oak', 850, 48], ['tree', 900, 48]];
  for (const [name, x, size] of front) put('front', name, x, 14, size);
  // stars by night
  const sky = document.getElementById('sky');
  const title = document.querySelector('.title > div').getBoundingClientRect();
  const jar = document.getElementById('jar').getBoundingClientRect();
  const fig = document.getElementById('figure').getBoundingClientRect();
  const clear = { l: jar.left - fig.left - 16, r: title.right - fig.left + 16, t: 0, b: title.bottom - fig.top + 12 };
  for (let k = 0; k < 60; k++) {
    const x = Math.round(rnd() * 950), y = Math.round(6 + rnd() * 110);
    if (x > clear.l && x < clear.r && y < clear.b) continue;     // keep the title clear
    const s = document.createElement('i'); s.className = 'star';
    Object.assign(s.style, { left: `${x}px`, top: `${y}px` });
    sky.appendChild(s);
  }
  document.body.dataset.ready = '1';
</script>
</body>
</html>
