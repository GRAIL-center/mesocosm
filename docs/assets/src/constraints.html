<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mesocosm constraints</title>
<link rel="stylesheet" href="figures.css">
<script src="../../../src/mesocosm/observe/static/sprites.js"></script>
<style>
  #figure { width: 960px; padding: 20px 22px 16px; }
  .groups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .group h2 { font: 700 12px/1 var(--pixel); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 4px; }
  .group > p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .item { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; margin-bottom: 9px; }
  .item .frame { width: 44px; height: 44px; display: grid; place-items: center; background: var(--panel);
                 border: 2px solid var(--line2); box-shadow: 0 2px 0 var(--line2); }
  .item .frame img { width: 32px; height: 32px; }
  .item b { display: block; font: 700 10px/1.2 var(--pixel); text-transform: uppercase; letter-spacing: .5px;
            margin-bottom: 2px; }
  .item span { display: block; font-size: 13px; line-height: 1.3; color: var(--muted); }
  .key { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 6px; padding-top: 12px; border-top: 2px dashed var(--line); }
  .key span { font: 700 9px/1 var(--pixel); text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
              display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 10px; height: 10px; display: inline-block; }
  .key i.dash { outline: 2px dashed var(--off); outline-offset: -2px; }
</style>
</head>
<body>
<div id="figure" class="fig">
  <div class="groups" id="groups"></div>
  <div class="key">
    <span><i style="background: var(--done)"></i>held</span>
    <span><i style="background: var(--tool)"></i>near a limit or pushed</span>
    <span><i style="background: var(--blocked)"></i>spent, failed or sprung</span>
    <span><i style="background: var(--info)"></i>tracked, no limit</span>
    <span><i class="dash"></i>not in this world</span>
  </div>
</div>
<script type="module">
  const S = window.MesoSprites;
  // the observer's board, group by group, in its order (src/mesocosm/observe/constraints.py)
  const GROUPS = [
    ['Fences', 'what can get in or out', [
      ['fence', 'Sandbox', 'no route out but the two gateways'],
      ['gate', 'Internet', 'real sites, allow-listed and logged'],
      ['burrow', 'Hidden channels', 'a pastebin or shared folder, on or off'],
      ['stump', 'Build cache', 'a shared store that leaks traces'],
    ]],
    ['Supplies', 'what agents can spend', [
      ['acorn', 'Tokens', 'a token budget per agent'],
      ['mushroom', 'Model calls', 'a request budget per agent'],
      ['coin', 'Cost', 'agent-hours at a GPU price'],
      ['pinecone', 'Ledger', 'in-world credits to earn or pay'],
    ]],
    ['Conditions', 'how the world behaves', [
      ['basket', 'Memory', 'reset or carried between tasks'],
      ['bloom', 'Exposure', 'a page that appears at a set time'],
      ['sun', 'Clock', 'a simulated calendar and deadline'],
      ['bird', 'Chat', 'channels and direct messages'],
      ['sapling', 'Models', 'a different model per agent'],
    ]],
    ['Watchers', 'what gets noticed', [
      ['honey', 'Traps', 'planted credentials'],
      ['honey', 'Honeypot', 'a decoy vault that logs every touch'],
      ['chest', 'Protected', 'files that must not change'],
      ['owl', 'Monitor', 'a model reads every transcript'],
      ['fox', 'Side task', 'a hidden second objective'],
      ['amanita', 'Flags', "the judge's candidate incidents"],
    ]],
  ];
  document.getElementById('groups').innerHTML = GROUPS.map(([name, sub, items]) => `
    <section class="group"><h2>${name}</h2><p>${sub}</p>
      ${items.map(([spr, title, text]) => `
        <div class="item"><div class="frame px"><img class="spr" src="${S.url(spr, 2)}" alt=""></div>
          <div><b>${title}</b><span>${text}</span></div></div>`).join('')}
    </section>`).join('');
  document.body.dataset.ready = '1';
</script>
</body>
</html>
