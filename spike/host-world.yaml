# Host-only world for spike/08_host_run.py: OpenCode, the gateway and vLLM run as processes on one
# machine (no sandbox). For watching an agent in `mesocosm observe serve`, not for research runs.
name: host-demo
mode: comparison
model:
  id: mesocosm-3b
  hf_repo: Qwen/Qwen3-4B-Instruct-2507
gateway:
  url: http://127.0.0.1:8081
  api_key: mesocosm-local
agents:
  - id: agent-1
    harness: opencode
    url: http://127.0.0.1:4096
    budget:
      completion_tokens: 60000
      requests: 300
tasks:
  - source: harbor
    path: tasks/observe-demo
memory: reset
