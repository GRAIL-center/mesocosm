<h1>API reference</h1>
<h2>acme.Client(base_url, retry=3, timeout=30)</h2>
<p>Opens a session against <code>base_url</code>. Raises <code>acme.Unreachable</code> after <code>retry</code> failed attempts.</p>
<h2>Client.get(path) / Client.post(path, json)</h2>
<p>Return the decoded JSON body. A non-2xx response raises <code>acme.HTTPError</code> with <code>.status</code>.</p>
